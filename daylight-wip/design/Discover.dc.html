<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover sources</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&amp;display=swap">
<style>
body{margin:0}
.mb{--bg:#fffaf0;--surface:#fffdf8;--surface-2:#faf5e8;--surface-3:#f5f0e0;--strong:#ebe6d6;--border:#e8e2d2;--border-soft:#f0ebdd;--text:#0a0a0a;--text-2:#3a3a3a;--text-3:#6f6a5f;--ink-on-text:#fffaf0;--teal:#1a3a3a;--teal-ink:#fffaf0;--teal-dim:#d9e6e2;--ochre:#e8b94a;--ochre-ink:#0a0a0a;--ochre-dim:#f7e7bd;--pink:#ff4d8b;--pink-ink:#0a0a0a;--pink-dim:#ffd6e5;--lav:#b8a4ed;--lav-ink:#0a0a0a;--lav-dim:#e6def9;--peach:#ffb084;--peach-ink:#0a0a0a;--peach-dim:#ffe2d1;--moss:#a9c97f;--moss-ink:#0a0a0a;--moss-dim:#e4eed5;--cobalt:#3b5bdb;--cobalt-ink:#fffaf0;--cobalt-dim:#dce3fa;--ok:#22a05a;font-family:Inter,ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.mb.night{--bg:#0a1a1a;--surface:#11221f;--surface-2:#1a2a2a;--surface-3:#22342f;--strong:#2b3d39;--border:rgba(255,250,240,.10);--border-soft:rgba(255,250,240,.06);--text:#fffaf0;--text-2:rgba(255,250,240,.76);--text-3:rgba(255,250,240,.58);--ink-on-text:#0a1a1a;--teal:#a4d4c5;--teal-ink:#0a1a1a;--teal-dim:rgba(164,212,197,.16);--ochre-dim:rgba(232,185,74,.16);--pink-dim:rgba(255,77,139,.16);--lav-dim:rgba(184,164,237,.16);--peach-dim:rgba(255,176,132,.16);--moss-dim:rgba(169,201,127,.16);--cobalt:#8ea2f2;--cobalt-ink:#0a1a1a;--cobalt-dim:rgba(142,162,242,.16)}
.mb *{box-sizing:border-box}
.mb button,.mb input{font:inherit;color:inherit}
.mb button{border:0;background:none;padding:0;cursor:pointer}
.mb .serif{font-family:Newsreader,'Iowan Old Style','Palatino Linotype',Georgia,serif;font-optical-sizing:auto}
.mb .eyebrow{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3)}
.mb .tnum{font-variant-numeric:tabular-nums}
.mb .peb{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.35)}
.mb .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mb a{color:inherit;text-decoration:none}
.mb :focus-visible{outline:2px solid var(--text);outline-offset:2px}
.mb input::placeholder{color:var(--text-3)}
a{color:#0a0a0a}a:hover{color:#3a3a3a}
</style>
</helmet>
<div class="mb {{theme}}" style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: var(--bg); color: var(--text)">

<header style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px 0 8px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="Sources.dc.html" aria-label="Back to sources" style="width: 44px; height: 44px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em">Discover</h1>
</div>
<span class="tnum" style="height: 32px; padding: 0 12px; border-radius: 9999px; background: var(--surface-3); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">9 of 20</span>
</header>

<div style="padding: 8px 16px 0; position: relative">
<label for="disc-search" class="sr">Search sources</label>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 30px; top: 23px; color: var(--text-3)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="disc-search" type="search" placeholder="Search 1,250 sources" style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 14px 0 44px; font-size: 15px">
</div>

<div role="group" aria-label="Topics" style="padding: 16px 16px 0; display: flex; flex-wrap: wrap; gap: 6px">
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 9999px; background: var(--surface-3); font-size: 14px; font-weight: 500">All topics</button>
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 9999px; background: var(--text); color: var(--ink-on-text); font-size: 14px; font-weight: 600">Product Management</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 9999px; background: var(--surface-3); font-size: 14px; font-weight: 500">AI &amp; Machine Learning</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 9999px; background: var(--surface-3); font-size: 14px; font-weight: 500">Venture Capital</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 9999px; background: var(--surface-3); font-size: 14px; font-weight: 500">Pakistan Tech</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 9999px; background: var(--surface-3); font-size: 14px; font-weight: 500">Software Development</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 9999px; background: var(--surface-3); font-size: 14px; font-weight: 500">Lifestyle &amp; Design</button>
<button type="button" style="height: 40px; padding: 0 12px 0 14px; border-radius: 9999px; border: 1px solid var(--border); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px">61 more<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="padding: 26px 20px 12px; display: flex; flex-direction: column; gap: 4px">
<h2 class="serif" style="margin: 0; font-size: 27px; line-height: 1.1; font-weight: 500; letter-spacing: -0.02em; text-wrap: balance">Product Management &amp; Strategy</h2>
<span class="tnum" style="font-size: 14px; color: var(--text-3)">19 sources · 1 already in your brief</span>
</div>

<div style="margin: 0 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 14px; border-top: {{r.rule}}">
<span class="peb" style="width: 34px; height: 34px; border-radius: 11px; font-size: 14px; background: {{r.fill}}; color: {{r.ink}}">{{r.letter}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="font-size: 13px; color: var(--text-3)">{{r.domain}}</span>
</div>
<sc-if value="{{r.added}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" aria-label="{{r.name}} is in your brief" style="height: 44px; padding: 0 12px; border-radius: 12px; background: var(--surface-3); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Added</button>
</sc-if>
<sc-if value="{{r.open}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="Add {{r.name}}" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
</sc-if>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--border-soft); backdrop-filter: blur(16px)">
<div style="display: flex; flex-direction: column">
<span class="tnum" style="font-size: 15px; font-weight: 600">9 of 20 sources</span>
<span style="font-size: 13px; color: var(--text-3)">A color is picked when you add one</span>
</div>
<a href="Sources.dc.html" style="height: 48px; padding: 0 24px; border-radius: 12px; background: var(--text); color: var(--ink-on-text); display: inline-flex; align-items: center; font-size: 15px; font-weight: 600">Done</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false,"section":"State"},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Product Talk (Teresa Torres)', 'producttalk.org'],
      ['Roman Pichler', 'romanpichler.com'],
      ['Product Coalition', 'productcoalition.com'],
      ['Silicon Valley Product Group', 'svpg.com'],
      ['Mind the Product', 'mindtheproduct.com'],
      ['Product Marketing Alliance', 'productmarketingalliance.com'],
      ['Productboard Blog', 'productboard.com'],
      ['Amplitude Blog', 'amplitude.com'],
      ['Pendo Blog', 'pendo.io'],
      ["Lenny's Newsletter", 'lennysnewsletter.com', 'ochre']
    ];
    return {
      theme: (this.props.night ?? false) ? 'night' : '',
      rows: list.map(([name, domain, c], i) => ({
        name, domain,
        letter: name.charAt(0),
        added: !!c,
        open: !c,
        fill: c ? 'var(--' + c + ')' : 'var(--surface-3)',
        ink: c ? 'var(--' + c + '-ink)' : 'var(--text-2)',
        rule: i === 0 ? '0' : '1px solid var(--border-soft)'
      }))
    };
  }
}
</script>
</body>
</html>
