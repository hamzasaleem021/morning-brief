<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save clipping</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&amp;display=swap">
<style>
body{margin:0}
.mb{--bg:#fffaf0;--surface:#fffdf8;--surface-2:#faf5e8;--surface-3:#f5f0e0;--strong:#ebe6d6;--border:#e8e2d2;--border-soft:#f0ebdd;--text:#0a0a0a;--text-2:#3a3a3a;--text-3:#6f6a5f;--ink-on-text:#fffaf0;--ochre:#e8b94a;--ochre-ink:#0a0a0a;--ok:#22a05a;font-family:Inter,ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.mb.night{--bg:#0a1a1a;--surface:#11221f;--surface-2:#1a2a2a;--surface-3:#22342f;--strong:#2b3d39;--border:rgba(255,250,240,.10);--border-soft:rgba(255,250,240,.06);--text:#fffaf0;--text-2:rgba(255,250,240,.76);--text-3:rgba(255,250,240,.58);--ink-on-text:#0a1a1a;--ok:#3ccf7a}
.mb *{box-sizing:border-box}
.mb button,.mb input,.mb textarea{font:inherit;color:inherit}
.mb button{border:0;background:none;padding:0;cursor:pointer}
.mb .serif{font-family:Newsreader,'Iowan Old Style','Palatino Linotype',Georgia,serif;font-optical-sizing:auto}
.mb .peb{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.35)}
.mb a{color:inherit;text-decoration:none}
.mb :focus-visible{outline:2px solid var(--text);outline-offset:2px}
.mb input::placeholder{color:var(--text-3)}
a{color:#0a0a0a}a:hover{color:#3a3a3a}
</style>
</helmet>
<div class="mb {{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--text)">

<header style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="Main.dc.html" aria-label="Discard and go back" style="width: 44px; height: 44px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em">Save clipping</h1>
<span aria-hidden="true" style="width: 44px"></span>
</header>

<main style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border)">
<span class="peb" style="width: 34px; height: 34px; border-radius: 11px; font-size: 14px; background: var(--ochre); color: var(--ochre-ink)">L</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">Lenny's Newsletter</span>
<span class="serif" style="font-size: 17px; line-height: 1.3; color: var(--text-2)">How to price a product nobody has bought yet</span>
<span style="margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ok)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Matched to a source in your brief</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<label for="clip-passage" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Passage</label>
<span style="font-size: 13px; color: var(--text-3)">Trim to the part you want</span>
</div>
<textarea id="clip-passage" rows="5" class="serif" style="resize: none; min-height: 168px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); padding: 16px; font-size: 19px; line-height: 1.5; font-style: italic">Your first price is a question you ask the market, not an answer you defend. Treat it like one.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="clip-note" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Note (optional)</label>
<input id="clip-note" type="text" placeholder="Why you kept this" style="height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 14px; font-size: 15px">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<a href="https://www.lennysnewsletter.com" style="height: 52px; border-radius: 12px; background: var(--text); color: var(--ink-on-text); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Save and go back to the article</a>
<a href="Clippings.dc.html" style="height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Save and open Clippings</a>
</div>

<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-3)">Later, tapping this clipping opens the article at this exact passage.</p>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false,"section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.night ?? false) ? 'night' : '' };
  }
}
</script>
</body>
</html>
